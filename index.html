<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eef2f6;
        }

        .weather-card {
            width: 260px;
            padding: 28px 22px;
            border-radius: 24px;
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            box-shadow: 0 20px 35px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .temp-box {
            width: 100%;
            padding: 18px 10px;
            border-radius: 16px;
            background-color: #f1f5f9;
            text-align: center;
            font-size: 38px;
            font-weight: 800;
            color: #0f172a;
            transition: color 0.2s ease;
        }

        .temp-box.status-text {
            font-size: 15px;
            font-weight: 600;
            color: #475569;
        }

        .refresh-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .refresh-btn:hover {
            background-color: #0369a1;
        }

        .refresh-btn:active {
            transform: scale(0.97);
        }

        .refresh-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <div class="title">Погода</div>
        <div class="temp-box status-text" id="tempDisplay">Temperature</div>
        <button class="refresh-btn" id="refreshBtn" type="button">Обновить</button>
    </div>

    <script>
        const API_URL = "https://api.open-meteo.com/v1/forecast?latitude=52.94&longitude=70.20¤t_weather=true";
        const tempDisplay = document.getElementById("tempDisplay");
        const refreshBtn = document.getElementById("refreshBtn");

        async function fetchWeather() {
            refreshBtn.disabled = true;
            tempDisplay.classList.add("status-text");
            tempDisplay.textContent = "Загрузка...";

            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                const weatherData = await response.json();
                const currentTemp = weatherData.current_weather.temperature;

                tempDisplay.classList.remove("status-text");
                tempDisplay.textContent = `${currentTemp}°C`;
            } catch (err) {
                tempDisplay.classList.add("status-text");
                tempDisplay.textContent = "Ошибка при получении данных";
                console.error(err);
            } finally {
                refreshBtn.disabled = false;
            }
        }

        refreshBtn.addEventListener("click", fetchWeather);
        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>
</html>
